$kind: http-request
url: "{{baseUrl}}/api/runs/{{run_id}}/logs"
method: GET
scripts:
  - type: afterResponse
    code: >-
      pm.test('returns 200 with text/event-stream content-type', function() {
          pm.response.to.have.status(200);
          pm.expect(pm.response.headers.get('content-type')).to.include('text/event-stream');
      });
    language: text/javascript
order: 3000
