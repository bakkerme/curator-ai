workflow:
  name: "AI Security Research"
  version: "1.0" # optional
  max_concurrency: 20
  dedupe_store:
      driver: "sqlite"
      dsn: "./curator-seen.db"
      table: "seen_posts"
      ttl: "365d"

  trigger:
    - cron:
        schedule: "0 0 * * 2" # Tuesday midnight UTC
        timezone: "UTC"       # explicit

  sources:
    - rss:
        include_content: true
        user_agent: "curator-ai/0.1"
        limit: 5
        convert_source_to_markdown: true
        feeds:
          # General Security
          - https://unit42.paloaltonetworks.com/feed/
          - https://googleprojectzero.blogspot.com/feeds/posts/default?alt=rss
          - https://developers.cloudflare.com/changelog/rss/application-security.xml
          - https://portswigger.net/research/rss
          - https://feeds.feedburner.com/TheHackersNews
          - https://blog.palantir.com/feed

          # AI Security
          - https://community.checkpoint.com/fyrhh23835/rss/Category?category.id=AI&interaction.style=forum
          
          # CDN
          - https://feeds.feedburner.com/akamai/blog
          - https://www.fastly.com/blog_rss.xml
          - https://docs-cybersec-be.thalesgroup.com/bundle/cloud-application-security/page/release-notes.rss

          # AI
          - https://deepmind.google/blog/rss.xml
          - https://openai.com/news/rss.xml

          # Bot Defence
          - https://datadome.co/feed/
          - https://blog.castle.io/rss/
          - https://fingerprint.com/rss.xml

          # Scraping
          - https://www.scrapingbee.com/index.xml
          - https://scrapfly.io/blog/feed.xml
          - https://www.imperva.com/blog/feed/

          # -- For scraping later --
          # - https://kameleo.io/blog
          # - https://www.humansecurity.com/learn/blog/
          # - https://www.arkoselabs.com/blog/
          # - https://oxylabs.io/blog
          # - https://www.darkreading.com/

  quality:
    - llm:
        name: is_relevant
        prompt_template: isRelevantTemplate
        evaluations:
          - "News on practical AI security"
          - "Vulnerabilities affecting AI agents or other AI tools"
          - "AI news that may have a security angle"
        exclusions:
          - "General AI news"
          - "General security news unrelated to AI"
          - "Unverifiable hot takes or speculation with no evidence"
          - "Content unrelated to the security threat landscape (e.g., general AI/company news)"
        action_type: pass_drop
        threshold: 0.75 # optional
        images:
          enabled: true
          mode: multimodal
          max_images: 1
          include_comment_images: false
        block_error_policy: drop

  post_summary:
    - llm:
        name: post_sum
        type: llm
        context: post
        prompt_template: postSummaryTemplate
        params:
          interests:
            - "AI/LLM app vulns and exploit paths: prompt injection, tool/function-calling abuse, data exfiltration, authz bypass, indirect prompt injection"
            - "Agent security: agentic browsing risks, plugin/tool supply chain, sandboxing/permissions, secrets handling, SSRF/file access, multi-agent trust boundaries"
            - "RAG & data layer issues: retrieval poisoning, vector DB leakage, prompt/data injection via docs, tenant isolation failures, PII exposure"
            - "Model-level security: jailbreak techniques, prompt/weight leakage, adversarial examples, training-data poisoning, watermarking/fingerprinting claims with evidence"
            - "Framework/integration vulnerabilities: LangChain/LlamaIndex/OpenAI SDKs, model gateways, eval/guardrail stacks, CI/CD or dependency issues impacting AI systems"
            - "Detection & mitigation with implementation detail: monitoring/telemetry, red-teaming methodology, evals, guardrails, policy-as-code, rate limits, provenance checks"
            - "Edge/CDN/WAF changes that affect AI apps or agents (API security, caching, token handling, bot/automation controls)"
        block_error_policy: drop

    - markdown:
        name: markdown_to_html_post_sum
        type: markdown
        context: post

  run_summary:
    - llm:
        name: full_sum
        type: llm
        context: flow
        prompt_template: fullSummaryTemplate
        params:
          focus:
            - "High-impact AI security vulnerabilities and real-world exploitation (agents, LLM apps, model gateways, eval/guardrail stacks)"
            - "New prompt-injection/jailbreak techniques, tool-abuse patterns, and practical bypasses of safety/guardrails"
            - "RAG and data-security incidents: leakage, poisoning, multi-tenant isolation failures, provenance/trust breakdowns"
            - "Defensive engineering guidance: concrete mitigations, detection ideas, instrumentation, and validation/eval approaches"
            - "Supply-chain and platform risks affecting AI systems: SDK/library CVEs, dependency compromises, hosted model platform changes"
            - "Edge/API security developments relevant to AI products (CDN/WAF behavior, auth/token patterns, bot/automation changes)"
        block_error_policy: drop
        
    - markdown:
        name: markdown_to_html_sum
        type: markdown
        context: "flow"


  output:
    - email:
        template: emailTemplate
        to: brandon@bdmd.com.au
        subject: "AI Security Digest"

templates:
  - id: isRelevantTemplate
    system_template: |-
      You are a strict relevance/quality evaluator.

      Evaluate the following post and output ONLY valid JSON with this exact shape:
      {"score": <number 0..1>, "reason": <string>}

      Scoring guidance:
      - 0.0 = completely irrelevant / low-signal
      - 1.0 = extremely relevant / high-signal

      Positive evaluation criteria (score higher when these apply):
      {{- range .Evaluations }}
      - {{ . }}
      {{- end }}

      Exclusion criteria (score near 0 when these apply):
      {{- range .Exclusions }}
      - {{ . }}
      {{- end }}

      Reason should be a single sentence of 25 words or less.

      Return ONLY the JSON object. No markdown, no code fences.
    template: |-
      -----USER CONTENT START-----
      Post:
      Title: {{ .Title }}
      URL: {{ .URL }}
      Author: {{ .Author }}
      CreatedAt: {{ .CreatedAt }}

      Content:
      {{ .Content }}

      Web Content:
      {{- range .WebBlocks }}
      - {{ .URL }}
        {{ .Page }}
      {{- end }}
      -----USER CONTENT END-----

  - id: postSummaryTemplate
    system_template: |-
      You are an expert technical analyst.

      Write a concise summary of the following post. Focus on the reader interests.
      Keep it factual, and include concrete details when present.

      Reader interests:
      {{- range (index .Params "interests") }}
      - {{ . }}
      {{- end }}

      Output format:
      - 3-6 bullet points
      - then "Why it matters:" (1-2 sentences)

    template: |-
      -----USER CONTENT START-----
      Post:
      Title: {{ .Title }}
      URL: {{ .URL }}
      Author: {{ .Author }}

      Content:
      {{ .Content }}

      Linked URLs:
      {{- range .WebBlocks }}
      - {{ .URL }}
        {{ .Page }}
      {{- end }}
      -----USER CONTENT END-----

  - id: postSummaryTemplateBatch
    system_template: |-
      You are an expert technical analyst.

      You will be given a list of posts. For each post, write a concise summary focused on the reader interests.
      Keep it factual, and include concrete details when present.

      Reader interests:
      {{- range (index .Params "interests") }}
      - {{ . }}
      {{- end }}

      Output format:
      - Return ONLY valid JSON.
      - The top-level value MUST be a JSON array with exactly {{ len .Blocks }} items.
      - Each item MUST be a string summary for the corresponding post (same order as provided).
      - No markdown, no code fences.
    template: |-
      There are {{ len .Blocks }} posts.

      {{- range $i, $p := .Blocks }}
      --- Post {{ $i }} ---
      Title: {{ $p.Title }}
      URL: {{ $p.URL }}
      Author: {{ $p.Author }}

      Content:
      {{ $p.Content }}

      Linked URLs:
      {{- range $w := $p.WebBlocks }}
      - {{ $w.URL }}
        {{ $w.Page }}
      {{- end }}
      {{- end }}
      
  - id: fullSummaryTemplate
    system_template: |-
      You are writing an aggregate digest across multiple posts.

      Produce an executive summary, then group notable items.

      Include an:
      - Executive summary, focused on 4-8 bullet points
      - 3 short LinkedIn posts that the recipient could make based on the news. The recipient is a Security Researcher.
      - Notable Items, pick 5 most relevant items to the focus area, bulleted, include post title + 1 sentence

      Focus areas:
      {{- range (index .Params "focus") }}
      - {{ . }}
      {{- end }}

      Output format:
      # Executive summary
      # LinkedIn Post ideas
      # Notable items

    template: |-
      There are {{ len .Blocks }} posts.

      Posts:
      {{- range $i, $p := .Blocks }}
      ---
      Title: {{ $p.Title }}
      URL: {{ $p.URL }}
      Author: {{ $p.Author }}
      Post summary (if present): {{- if $p.Summary }}
      {{ $p.Summary.Summary }}
      {{- else }}
      (none)
      {{- end }}
      {{- end }}

  - id: emailTemplate
    system_template: "--" # Email is still considered a prompt template right now
    template: |-
      <!doctype html>
      <html>
        <body style="margin:0;padding:0;background:#ffffff;">
          <div style="max-width:720px;margin:0 auto;padding:16px;font-family:Arial,Helvetica,sans-serif;color:#111;line-height:1.4;">
            <h1 style="margin:0 0 12px 0;font-size:22px;">Daily Bot Defence + Security Digest</h1>

            {{- if .RunSummary }}
            {{- .RunSummary.HTML }}
            {{- end }}

            <h2 style="margin:16px 0 8px 0;font-size:16px;">Posts ({{ len .Blocks }})</h2>

            {{- range .Blocks }}
            <div style="padding:12px 0;border-top:1px solid #e5e5e5;">
              {{- if gt (len .ImageBlocks) 0 }}
              <img src="{{ (index .ImageBlocks 0).URL }}" style="max-width:100%;height:auto;display:block;margin:0 0 8px 0;" />
              {{- end }}

              <div style="font-size:15px;font-weight:700;margin:0 0 4px 0;">
                <a href="{{ .URL }}" style="color:#111;text-decoration:underline;">{{ .Title }}</a>
              </div>

              <div style="font-size:12px;color:#666;margin:0 0 8px 0;">
                <a href="{{ .URL }}" style="color:#666;text-decoration:none;">{{ .URL }}</a>
              </div>

              <div style="font-size:13px;margin:0;">
                {{- if .Summary }}
                {{ .Summary.HTML }}
                {{- else }}
                (no summary)
                {{- end }}
              </div>

              {{- if .WebBlocks }}
              <div style="margin:10px 0 0 0;font-size:13px;">
                <div style="font-weight:700;margin:0 0 4px 0;">Links</div>
                <ul style="margin:0;padding-left:18px;">
                  {{- range .WebBlocks }}
                  <li style="margin:0 0 4px 0;"><a href="{{ .URL }}" style="color:#111;text-decoration:underline;">{{ .URL }}</a></li>
                  {{- end }}
                </ul>
              </div>
              {{- end }}
            </div>
            {{- end }}
          </div>
        </body>
      </html>
